<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Button Sound</title>

<style>
body{
    background:#87CEEB;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family: "Courier New", monospace;
}

.mc-button{
    font-size:20px;
    padding:15px 40px;
    color:white;
    background:linear-gradient(#6c6c6c,#4b4b4b);
    border:4px solid #2b2b2b;
    box-shadow:
        inset -4px -4px 0 #2a2a2a,
        inset 4px 4px 0 #8b8b8b,
        0 6px 0 #1b1b1b;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:2px;
    transition:all 0.1s;
}

.mc-button:active{
    box-shadow:
        inset -2px -2px 0 #2a2a2a,
        inset 2px 2px 0 #8b8b8b,
        0 2px 0 #1b1b1b;
    transform:translateY(4px);
}
</style>

</head>
<body>

<button class="mc-button" onclick="playSound()">PLAY GAME</button>

<audio id="clickSound" src="ach.mp3"></audio>

<script>
function playSound(){
    document.getElementById("clickSound").play();
}
</script>

</body>
</html>
